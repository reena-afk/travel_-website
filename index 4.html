<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <link rel="stylesheet" href="style 4.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <div  class="container">

        <div class="header">
            <img src="train logo.png" class="logo" alt="train" width="100px">
      </div>
      <h1>Train Booking Payment</h1>
      <p>MAS to BNC   Sleeper Class (SL)</p>
    </div>

    <div class="card">

        <h2>Summary</h2>

        <div class="row">
            <span>Tickets</span>
            <span>₹450</span>
        </div>

        <div class="row light">
            <span>Reservation Charges</span>
            <span>₹40</span>
        </div>
        <hr>

        <div class="row total">
            <span>Total Fare</span>
            <span>₹490</span>
        </div>
   <hr>
        <h2 class="mt">Payment Method</h2>

        <div class="payment-option">
            <i class="fa-solid fa-credit-card"></i>
            <span>Credit / Debit Card</span>
            <span class="check">✓</span>
             </div>

             <div class="card-inputs">
                <input type="text" placeholder="Card Number">
                <div class="small-inputs">
                    <input type="text" placeholder="MM/YY">
                    <input type="password" placeholder="CVV">
             </div>
            <p>Or</p>
             <div class="upi">

                <input type="text" placeholder="UPI ID">
             </div>

             <button class="pay-btn">Pay ₹490</button>
             </div>
             </div>
             <div class="right">
<a href="index 5.html">click here</a>
             </div>
</body>
</html>
